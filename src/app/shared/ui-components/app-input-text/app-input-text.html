<div class="field">
  @if (label) {
    <label [for]="id">{{ label }}</label>
  }

  <div class="input-shell" [class.input-shell--invalid]="invalid">
    @if (icon) {
      <span class="input-shell__leading" aria-hidden="true">
        <i [class]="icon"></i>
      </span>
    }

    <input
      class="app-input"
      [class.app-input--with-icon]="icon"
      [class.app-input--with-toggle]="type === 'password' && showPasswordToggle"
      [id]="id"
      [type]="resolvedType"
      [value]="value"
      [placeholder]="placeholder"
      [autocomplete]="autocomplete"
      [disabled]="disabled"
      [attr.aria-invalid]="invalid"
      [attr.aria-describedby]="invalid ? errorId : null"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (type === 'password' && showPasswordToggle) {
      <button
        class="password-toggle"
        type="button"
        [disabled]="disabled"
        [attr.aria-label]="passwordVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        (click)="togglePasswordVisibility()"
      >
        <i [class]="passwordVisible ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
      </button>
    }
  </div>

  @if (invalid && errorMessage) {
    <small [id]="errorId" class="field__error">{{ errorMessage }}</small>
  }
</div>
